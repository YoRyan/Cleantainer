<!doctype html>

<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="css/popup.css" />
        <script src="js/i18n.js" type="module" defer></script>
        <script src="js/popup.js" type="module" defer></script>
    </head>

    <body>
        <h1><i18n-message>popupTitle</i18n-message></h1>
        <hr />
        <ul id="cleaner-list"></ul>
        <p id="popup-loading">
            <i18n-message>popupLoading</i18n-message>
        </p>
        <hr />
        <div id="popup-menu">
            <button id="popup-options">
                <i18n-message>popupOptions</i18n-message>
            </button>
        </div>

        <template id="cleaner">
            <li class="cleaner container" is="popup-cleaner">
                <button class="cleaner-button">
                    <span class="cleaner-icon container-icon"></span>
                    <span class="cleaner-name container-name"
                        >CONTAINER NAME</span
                    >
                    <div class="cleaner-popin">
                        <span class="cleaner-confirm"
                            ><i18n-message>cleanConfirm</i18n-message></span
                        >
                        <span class="cleaner-progress"
                            ><i18n-message>cleanProgress</i18n-message></span
                        >
                        <span class="cleaner-done"
                            ><i18n-message>cleanDone</i18n-message></span
                        ><span class="cleaner-error"
                            ><i18n-message>cleanError</i18n-message></span
                        >
                    </div>
                </button>
                <button class="cleaner-pin">
                    <span class="cleaner-pin-icon"></span>
                </button>
            </li>
        </template>
    </body>
</html>
