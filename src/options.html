<!doctype html>

<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="css/options.css" />
        <script src="js/i18n.js" type="module" defer></script>
        <script src="js/options.js" type="module" defer></script>
    </head>

    <body>
        <fieldset id="appearance">
            <legend><span is="i18n-message">appearance</span></legend>
            <p>
                <input
                    type="radio"
                    id="appearance-density-default"
                    name="density"
                    value="default"
                /><label for="appearance-density-default"
                    ><span is="i18n-message">appearanceDensityDefault</span>
                    <span class="container container-density">
                        <span
                            class="container-icon"
                            data-identity-icon="circle"
                            data-identity-color="toolbar"
                        ></span>
                        <span class="container-name"
                            ><span is="i18n-message"
                                >appearanceDensityContainer</span
                            ></span
                        >
                    </span>
                </label>
            </p>
            <p>
                <input
                    type="radio"
                    id="appearance-density-touch"
                    name="density"
                    value="touch"
                /><label for="appearance-density-touch"
                    ><span is="i18n-message">appearanceDensityTouch</span>
                    <span class="container container-density">
                        <span
                            class="container-icon"
                            data-identity-icon="circle"
                            data-identity-color="toolbar"
                        ></span>
                        <span class="container-name"
                            ><span is="i18n-message"
                                >appearanceDensityContainer</span
                            ></span
                        >
                    </span>
                </label>
            </p>
        </fieldset>
        <fieldset id="clean-shortcut">
            <legend><span is="i18n-message">cleanShortcut</span></legend>
            <p id="clean-shortcut-description"></p>
            <p>
                <label for="clean-shortcut-select"
                    ><span is="i18n-message"
                        >cleanShortcutSelectLabel</span
                    ></label
                >
                <select is="shortcut-select" id="clean-shortcut-select">
                    <option value="1"></option>
                    <option value="2"></option>
                    <option value="3"></option>
                    <option value="4"></option>
                </select>
            </p>
            <ul>
                <li>
                    <input
                        type="checkbox"
                        class="container-enable"
                        id="container-enable_firefox-default"
                        data-cookie-store-id="firefox-default"
                    /><label
                        class="container"
                        for="container-enable_firefox-default"
                        ><span
                            class="container-icon"
                            data-identity-icon="default_no-container"
                            data-identity-color="toolbar"
                        ></span>
                        <span class="container-name"
                            ><span is="i18n-message"
                                >containerDefault</span
                            ></span
                        >
                    </label>
                </li>
                <li>
                    <input
                        type="checkbox"
                        class="container-enable"
                        id="container-enable_firefox-private"
                        data-cookie-store-id="firefox-private"
                    /><label
                        class="container"
                        for="container-enable_firefox-private"
                        ><span
                            class="container-icon"
                            data-identity-icon="default_private"
                            data-identity-color="purple"
                        ></span>
                        <span class="container-name"
                            ><span is="i18n-message"
                                >containerPrivate</span
                            ></span
                        >
                    </label>
                </li>
                <hr class="divider-user" />
                <hr class="divider-regex" />
                <li>
                    <input type="checkbox" id="regex-enable" /><label
                        for="regex-enable"
                        ><span is="i18n-message"
                            >cleanShortcutRegex</span
                        ></label
                    >
                    <textarea id="regex-input" wrap="soft"></textarea>
                </li>
            </ul>
        </fieldset>

        <div id="import-export">
            <button id="import-json">
                <span is="i18n-message">importFromFile</span>
            </button>
            <input
                type="file"
                id="import-json-picker"
                accept="application/json"
            />
            <button id="export-json">
                <span is="i18n-message">exportToFile</span>
            </button>
        </div>

        <template id="clean-shortcut-container">
            <li>
                <input type="checkbox" class="container-enable" /><label
                    class="container"
                    ><span class="container-icon"></span>
                    <span class="container-name">CONTAINER NAME</span>
                </label>
            </li>
        </template>
    </body>
</html>
