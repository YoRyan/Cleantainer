<!doctype html>

<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="css/options.css" />
        <script src="js/i18n.js" type="module" defer></script>
        <script src="js/options.js" type="module" defer></script>
    </head>

    <body>
        <fieldset id="quick-list-1" class="quick-list">
            <legend><span is="i18n-message">quickList1</span></legend>
            <p>
                <span is="i18n-message">quickList1Help</span>
            </p>
            <ul>
                <li>
                    <input
                        type="checkbox"
                        data-cookie-store-id="firefox-default"
                    /><span class="container"
                        ><span
                            class="container-icon"
                            data-identity-icon="default_no-container"
                            data-identity-color="toolbar"
                        ></span>
                        <span class="container-name"
                            ><span is="i18n-message"
                                >containerDefault</span
                            ></span
                        >
                    </span>
                </li>
                <li>
                    <input
                        type="checkbox"
                        data-cookie-store-id="firefox-private"
                    /><span class="container"
                        ><span
                            class="container-icon"
                            data-identity-icon="default_private"
                            data-identity-color="purple"
                        ></span>
                        <span class="container-name"
                            ><span is="i18n-message"
                                >containerPrivate</span
                            ></span
                        >
                    </span>
                </li>
                <hr class="divider-user" />
                <hr class="divider-regex" />
                <li>
                    <input type="checkbox" class="regex-enable" /><span
                        is="i18n-message"
                        >quickListRegex</span
                    >
                    <textarea class="regex-input" wrap="soft"></textarea>
                </li>
            </ul>
        </fieldset>

        <div id="import-export">
            <button id="import-json">
                <span is="i18n-message">importFromFile</span>
            </button>
            <input
                type="file"
                id="import-json-picker"
                accept="application/json"
            />
            <button id="export-json">
                <span is="i18n-message">exportToFile</span>
            </button>
        </div>

        <template id="quick-list-container">
            <li>
                <input type="checkbox" /><span class="container"
                    ><span class="container-icon"></span>
                    <span class="container-name">CONTAINER NAME</span>
                </span>
            </li>
        </template>
    </body>
</html>
