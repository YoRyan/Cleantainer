<!doctype html>

<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="popup.css" />
        <script src="/common/i18n.js" type="module" defer></script>
        <script src="popup.js" type="module" defer></script>
    </head>

    <body>
        <h1><span is="i18n-message">popupTitle</span></h1>
        <hr />
        <ul id="cleaner-list"></ul>
        <p id="popup-loading">
            <span is="i18n-message">popupLoading</span>
        </p>
        <hr />
        <div id="popup-menu">
            <button id="popup-options">
                <span is="i18n-message">popupOptions</span>
            </button>
        </div>

        <template id="cleaner">
            <li class="cleaner container">
                <button class="cleaner-button">
                    <span class="cleaner-name container-name"
                        >CONTAINER NAME</span
                    >
                    <span class="cleaner-popin">
                        <span class="cleaner-confirm"
                            ><span is="i18n-message">cleanConfirm</span></span
                        >
                        <span class="cleaner-progress"
                            ><span is="i18n-message">cleanProgress</span></span
                        >
                        <span class="cleaner-done"
                            ><span is="i18n-message">cleanDone</span></span
                        ></span
                    >
                </button>
                <button class="cleaner-pin"></button>
            </li>
        </template>
    </body>
</html>
