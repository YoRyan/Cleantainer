<!doctype html>

<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="popup.css" />
        <script src="/common/i18n.js" defer></script>
        <script src="popup.js" defer></script>
    </head>

    <body>
        <div>
            <h3><span is="i18n-message">popupTitle</span></h3>
            <ul id="container-list"></ul>
            <p id="container-loading">
                <span is="i18n-message">loadContainers</span>
            </p>
        </div>

        <template id="container">
            <li class="container">
                <span class="container-name">CONTAINER NAME</span>
                <span class="container-popin">
                    <span class="clean-confirm"
                        ><span is="i18n-message">cleanConfirm</span></span
                    >
                    <span class="clean-progress"
                        ><span is="i18n-message">cleanProgress</span></span
                    >
                    <span class="clean-done"
                        ><span is="i18n-message">cleanDone</span></span
                    ></span
                >
            </li>
        </template>
    </body>
</html>
