<!doctype html>

<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="popup.css" />
        <script src="i18n.js" defer></script>
        <script src="popup.js" defer></script>
    </head>

    <body>
        <div>
            <h3><span is="i18n-message">popupTitle</span></h3>
            <ul id="container-list"></ul>
            <p id="container-loading">
                <span is="i18n-message">loadContainers</span>
            </p>
            <label>
                <span is="i18n-message">rangeLabel</span>
                <select id="clear-range">
                    <option value="lastHour" data-i18n-message>
                        rangeOneHour
                    </option>
                    <option value="lastTwoHours" data-i18n-message>
                        rangeTwoHours
                    </option>
                    <option value="lastFourHours" data-i18n-message>
                        rangeFourHours
                    </option>
                    <option value="sinceMidnight" data-i18n-message>
                        rangeSinceMidnight
                    </option>
                    <hr />
                    <option value="everything" data-i18n-message>
                        rangeUnlimited
                    </option>
                </select>
            </label>
        </div>

        <template id="container">
            <li class="container">
                <span class="container-name">CONTAINER NAME</span>
                <span class="clear-confirm"
                    ><span is="i18n-message">clearConfirm</span></span
                >
                <span class="clear-progress"
                    ><span is="i18n-message">clearProgress</span></span
                >
                <span class="clear-done"
                    ><span is="i18n-message">clearDone</span></span
                >
            </li>
        </template>
    </body>
</html>
